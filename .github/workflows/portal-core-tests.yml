name: Portal core unit tests
on:
  push:
    branches: [feature/client-portal-foundation]
    paths:
      - 'portal-core/**'
      - '.github/workflows/portal-core-tests.yml'
  pull_request:
    paths:
      - 'portal-core/**'
      - '.github/workflows/portal-core-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          for file in portal-core/*.mjs; do node --check "$file"; done
      - name: Run Node unit tests
        run: node --test portal-core/*.test.mjs
